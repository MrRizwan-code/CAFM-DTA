    <text style="font-size: 11px; font-family: 'Arial', 'DejaVu Sans'" transform="translate(627.000391 390.385507)">Scale and shift projections</text>
    <text style="font-size: 11px; font-family: 'Arial', 'DejaVu Sans'" transform="translate(653.897969 404.511054)">64 → 400 each</text>
   </g>
   <g id="text_11">
    <text style="font-size: 12px; font-family: 'Arial', 'DejaVu Sans'" transform="translate(625.121812 495.580726)">FiLM parameters</text>
    <text style="font-size: 12px; font-family: 'Arial', 'DejaVu Sans'" transform="translate(614.497125 511.069163)">γ = 1 + g(c);  β = b(c)</text>
   </g>
   <g id="text_12">
