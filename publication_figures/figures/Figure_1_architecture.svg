   </g>
   <g id="text_5">
    <text style="font-size: 12px; font-family: 'Arial', 'DejaVu Sans'" transform="translate(214.08825 248.460817)">PSICHIC backbone</text>
    <text style="font-size: 12px; font-family: 'Arial', 'DejaVu Sans'" transform="translate(161.397937 263.729879)">Three coupled message-passing layers</text>
    <text style="font-size: 12px; font-family: 'Arial', 'DejaVu Sans'" transform="translate(179.06325 279.139567)">Drug–protein interaction updates</text>
   </g>
   <g id="text_6">
    <text style="font-size: 11px; font-family: 'Arial', 'DejaVu Sans'" transform="translate(165.215359 382.990156)">Attention-weighted pooling and projection</text>
    <text style="font-size: 11px; font-family: 'Arial', 'DejaVu Sans'" transform="translate(159.587312 397.316796)">Drug vector (200-d) + protein vector (200-d)</text>
   </g>
   <g id="text_7">
    <text style="font-size: 11px; font-family: 'Arial', 'DejaVu Sans'" transform="translate(230.643875 495.973421)">Concatenation</text>
    <text style="font-size: 11px; font-family: 'Arial', 'DejaVu Sans'" transform="translate(190.606453 510.171155)">Interaction fingerprint h (400-d)</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10.5px; font-family: 'Arial', 'DejaVu Sans'" transform="translate(604.828477 116.354408)">Measurement type (32-d embedding)</text>
    <text style="font-size: 10.5px; font-family: 'Arial', 'DejaVu Sans'" transform="translate(617.672109 130.029837)">Assay format (32-d embedding)</text>
   </g>
   <g id="text_9">
    <text style="font-size: 11px; font-family: 'Arial', 'DejaVu Sans'" transform="translate(612.323984 249.593434)">Concatenate embeddings (64-d)</text>
    <text style="font-size: 11px; font-family: 'Arial', 'DejaVu Sans'" transform="translate(641.372578 263.718981)">MLP: 64 → 64 → 64</text>
    <text style="font-size: 11px; font-family: 'Arial', 'DejaVu Sans'" transform="translate(646.258125 277.764606)">ReLU; dropout 0.1</text>
   </g>
   <g id="text_10">
